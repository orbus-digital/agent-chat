name: Publier l'interface

# GitHub Pages, en mode « branche », ne sait servir que la racine du dépôt ou
# /docs — jamais /web. L'artefact est donc construit explicitement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # L'interface n'est publiée que si elle passe : une page cassée en
      # production coûte plus cher qu'un déploiement qui n'a pas lieu.
      - name: Tests
        run: npm test

      # Dans le dépôt, web/lib est un lien symbolique vers lib/ : une seule
      # copie du noyau, donc aucune dérive possible entre l'interface et le
      # CLI. Un artefact Pages, lui, ne transporte pas les liens : on
      # matérialise la copie ici, au dernier moment.
      - name: Matérialiser le noyau partagé dans l'artefact
        run: |
          test -L web/lib || { echo "web/lib devrait être un lien symbolique"; exit 1; }
          rm web/lib
          cp -r lib web/lib
          test -f web/lib/crypto.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploiement
        uses: actions/deploy-pages@v4
